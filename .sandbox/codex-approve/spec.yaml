# Fork of the built-in Docker Sandboxes `codex` agent. Its only purpose is to
# replace the default YOLO launch command with "approve for me".
#
# The sbx codex template launches
# `codex --dangerously-bypass-approvals-and-sandbox` by default (no approvals,
# no sandbox). Passing flags through `--` only APPENDS to the default flags and
# cannot cancel them, so the entrypoint has to be replaced. entrypoint lives in
# the `sandbox:` block, which a mixin (../kit/spec.yaml) must not declare —
# hence this separate kit.
#
# Usage (host side; the positional agent argument is this kit's name, and --kit
# is given twice):
#   sbx run codex-approve --clone --kit ./.sandbox/kit --kit ./.sandbox/codex-approve
#
# Caveat: a kit that extends a built-in agent cannot use the proxy-managed
# OAuth, so instead of ChatGPT subscription auth an API key must be registered
# on the host before launching (`sbx secret set openai`). To keep subscription
# auth, do not use this kit — create the sandbox and launch through `sbx exec`
# instead (/docs/knowledge/runbooks/agent-sandbox-sbx.md "Overriding the YOLO default", method A).
#
# Schema: https://docs.docker.com/ai/sandboxes/customize/kit-reference/
schemaVersion: "2"
kind: sandbox
name: codex-approve
displayName: Codex (approve for me)
description: Fork of codex that launches Codex in approve-for-me mode
extends: codex

sandbox:
  # The effective command is entrypoint + command (command.interactive for TTY
  # sessions, command.default otherwise). Whether the parent's
  # `--dangerously-bypass-approvals-and-sandbox` sits in its entrypoint or in
  # its command tail is not published, so BOTH are declared explicitly to
  # inherit nothing. Replacing only the entrypoint could leave the bypass flag
  # in place — still YOLO, with no visible error.
  #
  # --approve-for-me keeps the workspace-write sandbox and routes escalated
  # approval requests to the automatic reviewer instead of a human. It is the
  # launch-flag form of what the shared mixin seeds into ~/.codex/config.toml
  # (approval_policy = "on-request" / approvals_reviewer = "auto_review"); the
  # config is what applies when Claude Code delegates to Codex.
  entrypoint: [codex]
  command:
    default: ["--approve-for-me"]
    interactive: ["--approve-for-me"]
