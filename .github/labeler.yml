# Configuration for actions/labeler (run by .github/workflows/label_pr.yml).
# Labels PRs that modify the development harness (agent instructions, CI,
# containers, tooling config) rather than application code.
#
# Note: the labeler's `dot` option defaults to true, so globs match
# dot-directories like .github/ and .vscode/ without special handling.
# Deliberately excluded: moon.mod dependency bumps are routine churn, but
# moon.mod also carries module metadata, so it stays listed here.

meta:
  - changed-files:
      - any-glob-to-any-file:
          # Agent / contributor instructions
          - "AGENTS.md"
          - "CLAUDE.md"
          # GitHub config (workflows, templates, copilot-instructions.md, this file)
          - ".github/**"
          # Containers
          - "Dockerfile"
          - ".dockerignore"
          - "compose.yml"
          - "compose.dev.yml"
          - ".sandbox/**"
          # Tooling / editor config
          - "moon.mod"
          - "justfile"
          - ".pre-commit-config.yaml"
          - ".editorconfig"
          - ".vscode/**"
