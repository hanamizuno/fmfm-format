version: 2

# Note: Dependabot has no mooncakes ecosystem — MoonBit dependencies in moon.mod
# and the MoonBit toolchain (installed as `latest` in Dockerfile / CI) are
# updated manually (e.g. `moon update && moon add <pkg>`).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
